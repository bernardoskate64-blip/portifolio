      html, body { margin: 0; height: 100%; background: #0a0b0d; color-scheme: dark; }
      /* Em conexão lenta, um traço discreto indica carregamento. Em conexão rápida nunca chega a aparecer. */
      .boot { position: fixed; top: 50%; left: 50%; width: 96px; height: 1px; margin-left: -48px; overflow: hidden; background: rgba(255, 255, 255, 0.1); opacity: 0; animation: boot-in 0.4s ease 0.7s forwards; }
      .boot::after { content: ''; display: block; width: 40%; height: 100%; background: rgba(255, 255, 255, 0.65); animation: boot-run 1.3s ease-in-out infinite alternate; }
      @keyframes boot-in { to { opacity: 1; } }
      @keyframes boot-run { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot::after { animation: none; width: 100%; } }
